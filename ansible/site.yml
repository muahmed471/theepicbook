---
- name: Deploy EpicBook Application
  hosts: frontend
  become: true

  vars:
    app_dir: /opt/epicbook
    app_user: epicbook
    app_port: 3000
    app_repo: "https://github.com/muahmed471/theepicbook.git"

    # Azure MySQL settings
    mysql_database: "bookstore"
    mysql_username: "epicbookadmin"

  tasks:

    # ---------------------------------------------------------
    # 1. Operating system packages
    # ---------------------------------------------------------

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - nginx
          - build-essential
        state: present

    # ---------------------------------------------------------
    # 2. Node.js
    # ---------------------------------------------------------

    - name: Check installed Node.js version
      ansible.builtin.command:
        cmd: node --version
      register: node_version_check
      changed_when: false
      failed_when: false

    - name: Install Node.js 22
      ansible.builtin.shell: |
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install -y nodejs
      args:
        executable: /bin/bash
      when:
        - node_version_check.rc != 0

    - name: Display Node.js version
      ansible.builtin.command:
        cmd: node --version
      register: node_version_output
      changed_when: false

    - name: Display npm version
      ansible.builtin.command:
        cmd: npm --version
      register: npm_version_output
      changed_when: false

    - name: Show Node.js version
      ansible.builtin.debug:
        msg: "Node.js version: {{ node_version_output.stdout }}"

    - name: Show npm version
      ansible.builtin.debug:
        msg: "npm version: {{ npm_version_output.stdout }}"

    # ---------------------------------------------------------
    # 3. EpicBook application user
    # ---------------------------------------------------------

    - name: Create EpicBook application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /bin/bash
        create_home: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    # ---------------------------------------------------------
    # 4. Git configuration
    # ---------------------------------------------------------

    - name: Configure Git safe directory
      ansible.builtin.command:
        cmd: "git config --global --add safe.directory {{ app_dir }}"
      changed_when: false

    - name: Check whether application repository exists
      ansible.builtin.stat:
        path: "{{ app_dir }}/.git"
      register: git_directory

    - name: Clone EpicBook repository
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: main
        force: true
      when: not git_directory.stat.exists

    - name: Configure EpicBook Git repository ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    - name: Configure Git safe directory after ownership change
      ansible.builtin.command:
        cmd: "git config --global --add safe.directory {{ app_dir }}"
      changed_when: false

    - name: Configure EpicBook Git remote
      ansible.builtin.command:
        cmd: "git remote set-url origin {{ app_repo }}"
        chdir: "{{ app_dir }}"
      changed_when: false

    - name: Fetch latest EpicBook repository
      ansible.builtin.command:
        cmd: git fetch origin main
        chdir: "{{ app_dir }}"

    - name: Reset EpicBook repository to latest main
      ansible.builtin.command:
        cmd: git reset --hard origin/main
        chdir: "{{ app_dir }}"

    # ---------------------------------------------------------
    # 5. Configure application ownership
    # ---------------------------------------------------------

    - name: Set application ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    # ---------------------------------------------------------
    # 6. Configure Azure MySQL
    # ---------------------------------------------------------

    - name: Validate required MySQL deployment variables
      ansible.builtin.assert:
        that:
          - mysql_fqdn is defined
          - mysql_fqdn | length > 0
          - mysql_username is defined
          - mysql_username | length > 0
          - mysql_password is defined
          - mysql_password | length > 0
          - mysql_database is defined
          - mysql_database | length > 0
        fail_msg: >
          Required MySQL variables are missing.
          Ensure mysql_fqdn, mysql_username, mysql_password
          and mysql_database are passed to Ansible.

    - name: Create EpicBook production database configuration
      ansible.builtin.copy:
        dest: "{{ app_dir }}/config/config.json"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
        content: |
          {
            "development": {
              "username": "root",
              "password": "demo1234",
              "database": "bookstore",
              "host": "127.0.0.1",
              "dialect": "mysql"
            },
            "test": {
              "username": "root",
              "password": null,
              "database": "database_test",
              "host": "127.0.0.1",
              "dialect": "mysql"
            },
            "production": {
              "username": "{{ mysql_username }}",
              "password": "{{ mysql_password }}",
              "database": "{{ mysql_database }}",
              "host": "{{ mysql_fqdn }}",
              "dialect": "mysql",
              "dialectOptions": {
                "ssl": {
                  "require": true,
                  "rejectUnauthorized": false
                }
              }
            }
          }
      no_log: true

    # ---------------------------------------------------------
    # 7. Install Node dependencies
    # ---------------------------------------------------------

    - name: Install npm dependencies
      ansible.builtin.command:
        cmd: npm install
        chdir: "{{ app_dir }}"

    - name: Set application ownership after npm install
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    # ---------------------------------------------------------
    # 8. Check package.json and build
    # ---------------------------------------------------------

    - name: Read package.json
      ansible.builtin.slurp:
        src: "{{ app_dir }}/package.json"
      register: package_json

    - name: Build EpicBook application
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ app_dir }}"
      when: >
        'build' in
        ((package_json.content | b64decode | from_json).scripts | default({}))

    # ---------------------------------------------------------
    # 9. EpicBook systemd service
    # ---------------------------------------------------------

    - name: Create EpicBook systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/epicbook.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=EpicBook Application
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          Environment=NODE_ENV=production
          Environment=PORT={{ app_port }}
          ExecStart=/usr/bin/npm start
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable EpicBook service
      ansible.builtin.systemd:
        name: epicbook
        enabled: true

    - name: Restart EpicBook service
      ansible.builtin.systemd:
        name: epicbook
        state: restarted

    # ---------------------------------------------------------
    # 10. Wait for Node.js application
    # ---------------------------------------------------------

    - name: Wait for EpicBook application port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        delay: 3
        timeout: 60
        state: started

    # ---------------------------------------------------------
    # 11. Check EpicBook systemd service
    # ---------------------------------------------------------

    - name: Check EpicBook service
      ansible.builtin.systemd:
        name: epicbook
      register: epicbook_service

    - name: Display EpicBook service status
      ansible.builtin.debug:
        msg: "EpicBook service state: {{ epicbook_service.status.ActiveState }}"

    # ---------------------------------------------------------
    # 12. Configure Nginx
    # ---------------------------------------------------------

    - name: Configure Nginx for EpicBook
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/epicbook
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80;
              listen [::]:80;

              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};

                  proxy_http_version 1.1;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }

    - name: Enable EpicBook Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/epicbook
        dest: /etc/nginx/sites-enabled/epicbook
        state: link
        force: true

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: restarted

    # ---------------------------------------------------------
    # 13. Validate application
    # ---------------------------------------------------------

    - name: Check EpicBook local HTTP endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}"
        status_code: 200
      register: epicbook_local_http
      retries: 10
      delay: 3
      until: epicbook_local_http.status == 200

    - name: Check EpicBook HTTP endpoint through Nginx
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        status_code: 200
      register: epicbook_http
      retries: 10
      delay: 3
      until: epicbook_http.status == 200

    # ---------------------------------------------------------
    # 14. Final deployment result
    # ---------------------------------------------------------

    - name: Display deployment result
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "EpicBook deployment completed successfully"
          - "============================================"
          - "Application service: {{ epicbook_service.status.ActiveState }}"
          - "Node.js port: {{ app_port }}"
          - "Local HTTP status: {{ epicbook_local_http.status }}"
          - "Nginx HTTP status: {{ epicbook_http.status }}"
          - "MySQL host: {{ mysql_fqdn }}"
          - "MySQL database: {{ mysql_database }}"
          - "============================================"
