---
- name: Deploy EpicBook Application
  hosts: frontend
  become: true

  vars:
    app_dir: /opt/epicbook
    app_user: epicbook
    app_port: 3000
    node_major_version: "22"

  tasks:

    # =========================================================
    # SYSTEM PACKAGES
    # =========================================================

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - nginx
          - build-essential
        state: present

    # =========================================================
    # NODE.JS
    # =========================================================

    - name: Check whether Node.js is installed
      ansible.builtin.command:
        cmd: node --version
      register: node_version_check
      changed_when: false
      failed_when: false

    - name: Install Node.js 22
      ansible.builtin.shell: |
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install -y nodejs
      args:
        executable: /bin/bash
      when:
        - node_version_check.rc != 0
        - node_version_check.stdout is not search("v22")

    - name: Display Node.js version
      ansible.builtin.command:
        cmd: node --version
      register: node_version_output
      changed_when: false

    - name: Display npm version
      ansible.builtin.command:
        cmd: npm --version
      register: npm_version_output
      changed_when: false

    - name: Show Node.js version
      ansible.builtin.debug:
        msg: "Node.js version: {{ node_version_output.stdout }}"

    - name: Show npm version
      ansible.builtin.debug:
        msg: "npm version: {{ npm_version_output.stdout }}"

    # =========================================================
    # APPLICATION USER
    # =========================================================

    - name: Create EpicBook application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /bin/bash
        create_home: true

    # =========================================================
    # APPLICATION DIRECTORY
    # =========================================================

    - name: Create EpicBook application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    # =========================================================
    # EPICBOOK GITHUB REPOSITORY
    # =========================================================

    - name: Check whether EpicBook Git repository exists
      ansible.builtin.stat:
        path: "{{ app_dir }}/.git"
      register: git_directory

    - name: Clone EpicBook repository
      become_user: "{{ app_user }}"
      ansible.builtin.git:
        repo: "https://github.com/muahmed471/theepicbook.git"
        dest: "{{ app_dir }}"
        version: main
        force: true
        update: true
      when: not git_directory.stat.exists

    - name: Update EpicBook repository
      become_user: "{{ app_user }}"
      ansible.builtin.git:
        repo: "https://github.com/muahmed471/theepicbook.git"
        dest: "{{ app_dir }}"
        version: main
        force: true
        update: true
      when: git_directory.stat.exists

    # =========================================================
    # APPLICATION PERMISSIONS
    # =========================================================

    - name: Set EpicBook application ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    # =========================================================
    # NODE DEPENDENCIES
    # =========================================================

    - name: Install npm dependencies
      become_user: "{{ app_user }}"
      ansible.builtin.command:
        cmd: npm install
        chdir: "{{ app_dir }}"

    # =========================================================
    # CHECK PACKAGE.JSON
    # =========================================================

    - name: Read package.json
      ansible.builtin.slurp:
        src: "{{ app_dir }}/package.json"
      register: package_json

    - name: Check package.json scripts
      ansible.builtin.debug:
        msg: >-
          Available npm scripts:
          {{
            ((package_json.content | b64decode | from_json).scripts | default({}))
            | dict2items
            | map(attribute='key')
            | list
          }}

    # =========================================================
    # BUILD APPLICATION
    # =========================================================

    - name: Build EpicBook application
      become_user: "{{ app_user }}"
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ app_dir }}"
      when:
        - "'build' in ((package_json.content | b64decode | from_json).scripts | default({}))"

    # =========================================================
    # SYSTEMD SERVICE
    # =========================================================

    - name: Create EpicBook systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/epicbook.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=EpicBook Application
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_user }}
          WorkingDirectory={{ app_dir }}

          Environment=NODE_ENV=production
          Environment=PORT={{ app_port }}

          ExecStart=/usr/bin/npm start

          Restart=always
          RestartSec=5

          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable EpicBook systemd service
      ansible.builtin.systemd:
        name: epicbook
        enabled: true

    - name: Start EpicBook systemd service
      ansible.builtin.systemd:
        name: epicbook
        state: started

    # =========================================================
    # NGINX CONFIGURATION
    # =========================================================

    - name: Create EpicBook Nginx configuration
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/epicbook
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80;
              listen [::]:80;

              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};

                  proxy_http_version 1.1;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }

    - name: Enable EpicBook Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/epicbook
        dest: /etc/nginx/sites-enabled/epicbook
        state: link
        force: true

    - name: Remove default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Enable Nginx service
      ansible.builtin.systemd:
        name: nginx
        enabled: true

    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted

    # =========================================================
    # APPLICATION SERVICE VERIFICATION
    # =========================================================

    - name: Check EpicBook systemd service
      ansible.builtin.systemd:
        name: epicbook
      register: epicbook_service

    - name: Display EpicBook service state
      ansible.builtin.debug:
        msg:
          - "EpicBook service state: {{ epicbook_service.status.ActiveState }}"
          - "EpicBook service enabled: {{ epicbook_service.status.UnitFileState }}"

    # =========================================================
    # LOCAL APPLICATION HEALTH CHECK
    # =========================================================

    - name: Wait for EpicBook application
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        delay: 3
        timeout: 60

    - name: Check EpicBook application directly
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/"
        status_code:
          - 200
          - 301
          - 302
      register: epicbook_direct_http

    - name: Check EpicBook through Nginx
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        status_code:
          - 200
          - 301
          - 302
      register: epicbook_nginx_http

    # =========================================================
    # FINAL DEPLOYMENT RESULT
    # =========================================================

    - name: Display deployment result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "EpicBook deployment completed"
          - "=========================================="
          - "Application directory: {{ app_dir }}"
          - "Application port: {{ app_port }}"
          - "Node.js: {{ node_version_output.stdout }}"
          - "EpicBook service: {{ epicbook_service.status.ActiveState }}"
          - "Direct HTTP status: {{ epicbook_direct_http.status }}"
          - "Nginx HTTP status: {{ epicbook_nginx_http.status }}"
          - "MySQL FQDN supplied by pipeline: {{ mysql_fqdn | default('Not supplied') }}"
          - "=========================================="
