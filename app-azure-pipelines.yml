trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:

  # ==========================================
  # Application / Infrastructure Variables
  # ==========================================

  - name: appPublicIp
    value: '20.219.122.217'

  - name: mysqlFqdn
    value: 'epicbookmysql20261007.mysql.database.azure.com'

  - name: mysqlUsername
    value: 'epicbookadmin'

  - name: mysqlDatabase
    value: 'bookstore'

  - name: sshUser
    value: 'azureuser'


stages:

# ==========================================================
# Stage 1: Deploy EpicBook
# ==========================================================

- stage: Deploy
  displayName: Deploy EpicBook

  jobs:

  - job: AnsibleDeploy
    displayName: Ansible Deploy

    steps:

    # ======================================================
    # 1. Checkout Application Source Code
    # ======================================================

    - checkout: self
      displayName: Checkout EpicBook Repository


    # ======================================================
    # 2. Install Ansible
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Installing Ansible"
        echo "=========================================="

        sudo apt-get update
        sudo apt-get install -y ansible

        echo ""
        echo "=========================================="
        echo "Ansible Version"
        echo "=========================================="

        ansible --version

      displayName: Install Ansible


    # ======================================================
    # 3. Download SSH Private Key
    # ======================================================

    - task: DownloadSecureFile@1
      name: sshKey
      displayName: Download SSH Private Key

      inputs:
        secureFile: 'id_ed25519'


    # ======================================================
    # 4. Configure SSH
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Configuring SSH"
        echo "=========================================="

        mkdir -p "$HOME/.ssh"

        # Copy the Azure DevOps Secure File to a known location
        cp "$(sshKey.secureFilePath)" "$HOME/.ssh/id_rsa"

        # Secure permissions
        chmod 600 "$HOME/.ssh/id_rsa"

        # Create known_hosts
        touch "$HOME/.ssh/known_hosts"

        # Add VM host key
        ssh-keyscan -H "$(appPublicIp)" >> "$HOME/.ssh/known_hosts"

        chmod 644 "$HOME/.ssh/known_hosts"

        echo ""
        echo "SSH private key installed at:"
        echo "$HOME/.ssh/id_rsa"

        echo ""
        echo "Checking SSH private key..."

        test -f "$HOME/.ssh/id_rsa"

        echo "SSH private key exists."

        echo ""
        echo "SSH key fingerprint:"

        ssh-keygen -lf "$HOME/.ssh/id_rsa"

        echo ""
        echo "SSH configuration completed successfully."

      displayName: Configure SSH


    # ======================================================
    # 5. Create Ansible Inventory
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Creating Ansible Inventory"
        echo "=========================================="

        mkdir -p ansible

        cat > ansible/inventory.ini <<EOF
        [frontend]
        epicbook ansible_host=$(appPublicIp) ansible_user=$(sshUser) ansible_ssh_private_key_file=$HOME/.ssh/id_rsa
        EOF

        echo ""
        echo "=========================================="
        echo "Generated Ansible Inventory"
        echo "=========================================="

        cat ansible/inventory.ini

      displayName: Create Ansible Inventory


    # ======================================================
    # 6. Create Deployment Variables
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Creating Deployment Variables"
        echo "=========================================="

        mkdir -p ansible

        cat > ansible/deployment-vars.yml <<EOF
        app_public_ip: "$(appPublicIp)"
        mysql_fqdn: "$(mysqlFqdn)"
        mysql_username: "$(mysqlUsername)"
        mysql_password: "$(mysqlPassword)"
        mysql_database: "$(mysqlDatabase)"
        EOF

        echo ""
        echo "=========================================="
        echo "Deployment Variables"
        echo "=========================================="

        echo "app_public_ip: $(appPublicIp)"
        echo "mysql_fqdn: $(mysqlFqdn)"
        echo "mysql_username: $(mysqlUsername)"
        echo "mysql_database: $(mysqlDatabase)"
        echo "mysql_password: ********"

        echo ""
        echo "Deployment variables created successfully."

      displayName: Create Deployment Variables


    # ======================================================
    # 7. Test SSH Connection
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Testing SSH Connection"
        echo "=========================================="

        echo "Target:"
        echo "$(sshUser)@$(appPublicIp)"

        echo ""
        echo "Testing port 22..."

        timeout 10 bash -c \
          "cat < /dev/null > /dev/tcp/$(appPublicIp)/22"

        echo "Port 22 is reachable."

        echo ""
        echo "Checking private key..."

        test -f "$HOME/.ssh/id_rsa"

        echo "Private key found."

        echo ""
        echo "Testing SSH authentication..."

        ssh \
          -i "$HOME/.ssh/id_rsa" \
          -o IdentitiesOnly=yes \
          -o BatchMode=yes \
          -o ConnectTimeout=15 \
          -o StrictHostKeyChecking=yes \
          "$(sshUser)@$(appPublicIp)" \
          "echo 'SSH connection successful'; hostname; whoami"

        echo ""
        echo "=========================================="
        echo "SSH CONNECTION SUCCESSFUL"
        echo "=========================================="

      displayName: Test SSH Connection


    # ======================================================
    # 8. Test Ansible Connectivity
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Testing Ansible Connectivity"
        echo "=========================================="

        ansible \
          -i ansible/inventory.ini \
          frontend \
          -m ping \
          -e "@ansible/deployment-vars.yml"

        echo ""
        echo "=========================================="
        echo "ANSIBLE CONNECTIVITY SUCCESSFUL"
        echo "=========================================="

      displayName: Test Ansible Connectivity


    # ======================================================
    # 9. Validate Ansible Playbook
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Validating Ansible Playbook"
        echo "=========================================="

        ansible-playbook \
          -i ansible/inventory.ini \
          ansible/site.yml \
          -e "@ansible/deployment-vars.yml" \
          --syntax-check

        echo ""
        echo "Ansible syntax validation successful."

      displayName: Validate Ansible Playbook


    # ======================================================
    # 10. Run Ansible Playbook
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Starting EpicBook Deployment"
        echo "=========================================="

        ansible-playbook \
          -i ansible/inventory.ini \
          ansible/site.yml \
          -e "@ansible/deployment-vars.yml"

        echo ""
        echo "=========================================="
        echo "EPICBOOK DEPLOYMENT COMPLETED"
        echo "=========================================="

      displayName: Run Ansible Playbook