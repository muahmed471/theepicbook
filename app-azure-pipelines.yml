trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  appPublicIp: '20.219.122.217'
  mysqlFqdn: 'epicbookmysql20261007.mysql.database.azure.com'
  sshUser: 'azureuser'

stages:

# ==========================================
# Stage 1: Deploy EpicBook
# ==========================================
- stage: Deploy
  displayName: Deploy EpicBook

  jobs:
  - job: AnsibleDeploy
    displayName: Ansible Deploy

    steps:

    # --------------------------------------
    # Checkout application source
    # --------------------------------------
    - checkout: self

    # --------------------------------------
    # Install Ansible
    # --------------------------------------
    - script: |
        sudo apt-get update
        sudo apt-get install -y ansible
        ansible --version
      displayName: Install Ansible

    # --------------------------------------
    # Download SSH private key
    # --------------------------------------
    - task: DownloadSecureFile@1
      name: sshKey
      displayName: Download SSH Private Key
      inputs:
        secureFile: 'id_ed25519'

    # --------------------------------------
    # Configure SSH key
    # --------------------------------------
    - script: |
        mkdir -p ~/.ssh
        cp "$(sshKey.secureFilePath)" ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        ssh-keyscan -H "$(appPublicIp)" >> ~/.ssh/known_hosts

        echo "SSH key configured"
      displayName: Configure SSH

    # --------------------------------------
    # Create Ansible inventory
    # --------------------------------------
    - script: |
        mkdir -p ansible

        cat > ansible/inventory.ini <<EOF
        [frontend]
        epicbook ansible_host=$(appPublicIp) ansible_user=$(sshUser) ansible_ssh_private_key_file=~/.ssh/id_rsa
        EOF

        echo "Generated inventory:"
        cat ansible/inventory.ini
      displayName: Create Ansible Inventory

    # --------------------------------------
    # Create deployment variables
    # --------------------------------------
    - script: |
        cat > ansible/deployment-vars.yml <<EOF
        app_public_ip: "$(appPublicIp)"
        mysql_fqdn: "$(mysqlFqdn)"
        EOF

        echo "Deployment variables:"
        cat ansible/deployment-vars.yml
      displayName: Create Deployment Variables

    # --------------------------------------
    # Test SSH
    # --------------------------------------
    - script: |
        ssh -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          "$(sshUser)@$(appPublicIp)" \
          "hostname && echo SSH connection successful"
      displayName: Test SSH Connection

    # --------------------------------------
    # Run Ansible
    # --------------------------------------
    - script: |
        ansible-playbook \
          -i ansible/inventory.ini \
          ansible/site.yml \
          -e "@ansible/deployment-vars.yml"
      displayName: Run Ansible Playbook
