trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:

  # ==========================================
  # Application / Infrastructure Variables
  # ==========================================

  - name: appPublicIp
    value: '20.219.122.217'

  - name: mysqlFqdn
    value: 'epicbookmysql20261007.mysql.database.azure.com'

  - name: mysqlUsername
    value: 'epicbookadmin'

  - name: mysqlDatabase
    value: 'bookstore'

  - name: sshUser
    value: 'azureuser'


stages:

# ==========================================================
# Stage 1: Deploy EpicBook
# ==========================================================

- stage: Deploy
  displayName: Deploy EpicBook

  jobs:

  - job: AnsibleDeploy
    displayName: Ansible Deploy

    steps:

    # ======================================================
    # 1. Checkout Repository
    # ======================================================

    - checkout: self
      displayName: Checkout EpicBook Repository


    # ======================================================
    # 2. Install Ansible
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Installing Ansible"
        echo "=========================================="

        sudo apt-get update
        sudo apt-get install -y ansible

        echo "=========================================="
        echo "Ansible Version"
        echo "=========================================="

        ansible --version

      displayName: Install Ansible


    # ======================================================
    # 3. Download SSH Private Key
    # ======================================================

    - task: DownloadSecureFile@1
      name: sshKey
      displayName: Download SSH Private Key

      inputs:
        secureFile: 'id_rsa'


    # ======================================================
    # 4. Install SSH Key
    # ======================================================

    - task: InstallSSHKey@0
      displayName: Install SSH Private Key

      inputs:
        knownHostsEntry: '$(appPublicIp)'
        sshPublicKey: ''
        sshKeySecureFile: 'id_rsa'


    # ======================================================
    # 5. Verify SSH Key
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Checking SSH Configuration"
        echo "=========================================="

        echo "SSH directory:"
        ls -la ~/.ssh

        echo ""
        echo "SSH identities available:"
        ssh-add -L 2>/dev/null || true

        echo ""
        echo "Private key files:"
        find ~/.ssh -maxdepth 1 -type f -name 'id_rsa*' -ls

        echo ""
        echo "SSH key verification completed."

      displayName: Verify SSH Configuration


    # ======================================================
    # 6. Create Ansible Inventory
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Creating Ansible Inventory"
        echo "=========================================="

        mkdir -p ansible

        cat > ansible/inventory.ini <<EOF
        [frontend]
        epicbook ansible_host=$(appPublicIp) ansible_user=$(sshUser) ansible_ssh_private_key_file=$HOME/.ssh/id_rsa
        EOF

        echo ""
        echo "=========================================="
        echo "Generated Ansible Inventory"
        echo "=========================================="

        cat ansible/inventory.ini

      displayName: Create Ansible Inventory


    # ======================================================
    # 7. Create Deployment Variables
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Creating Deployment Variables"
        echo "=========================================="

        mkdir -p ansible

        cat > ansible/deployment-vars.yml <<EOF
        app_public_ip: "$(appPublicIp)"
        mysql_fqdn: "$(mysqlFqdn)"
        mysql_username: "$(mysqlUsername)"
        mysql_password: "$(mysqlPassword)"
        mysql_database: "$(mysqlDatabase)"
        EOF

        echo ""
        echo "=========================================="
        echo "Deployment Variables"
        echo "=========================================="

        echo "app_public_ip: $(appPublicIp)"
        echo "mysql_fqdn: $(mysqlFqdn)"
        echo "mysql_username: $(mysqlUsername)"
        echo "mysql_database: $(mysqlDatabase)"
        echo "mysql_password: ********"

        echo ""
        echo "Deployment variables created successfully."

      displayName: Create Deployment Variables


    # ======================================================
    # 8. Test SSH Connection
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Testing SSH Connection"
        echo "=========================================="

        echo "Target:"
        echo "$(sshUser)@$(appPublicIp)"

        echo ""
        echo "Testing port 22..."

        timeout 10 bash -c \
          "cat < /dev/null > /dev/tcp/$(appPublicIp)/22"

        echo "Port 22 is reachable."

        echo ""
        echo "Testing SSH authentication..."

        ssh \
          -i "$HOME/.ssh/id_rsa" \
          -o IdentitiesOnly=yes \
          -o BatchMode=yes \
          -o ConnectTimeout=15 \
          -o StrictHostKeyChecking=no \
          "$(sshUser)@$(appPublicIp)" \
          "echo 'SSH connection successful'; hostname; whoami"

        echo ""
        echo "=========================================="
        echo "SSH CONNECTION SUCCESSFUL"
        echo "=========================================="

      displayName: Test SSH Connection


    # ======================================================
    # 9. Test Ansible Connectivity
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Testing Ansible Connectivity"
        echo "=========================================="

        ansible \
          -i ansible/inventory.ini \
          frontend \
          -m ping \
          -e "@ansible/deployment-vars.yml"

        echo ""
        echo "Ansible connectivity test successful."

      displayName: Test Ansible Connectivity


    # ======================================================
    # 10. Validate Ansible Playbook
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Validating Ansible Playbook"
        echo "=========================================="

        ansible-playbook \
          -i ansible/inventory.ini \
          ansible/site.yml \
          -e "@ansible/deployment-vars.yml" \
          --syntax-check

        echo ""
        echo "Ansible syntax validation successful."

      displayName: Validate Ansible Playbook


    # ======================================================
    # 11. Run Ansible Playbook
    # ======================================================

    - script: |
        set -e

        echo "=========================================="
        echo "Starting EpicBook Deployment"
        echo "=========================================="

        ansible-playbook \
          -i ansible/inventory.ini \
          ansible/site.yml \
          -e "@ansible/deployment-vars.yml"

        echo ""
        echo "=========================================="
        echo "EPICBOOK DEPLOYMENT COMPLETED"
        echo "=========================================="

      displayName: Run Ansible Playbook